name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      packages: write # push the image
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Set up buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Log in to ghcr.io
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}

  # The macOS binaries, the GitHub release with its notes, and the Homebrew cask.
  binaries:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub release
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          # the release notes are generated from the full history
          fetch-depth: 0
      - name: Install go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
      - name: Release
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # pushes the cask to utkuozdemir/homebrew-tap
          PRIVATE_ACCESS_TOKEN: ${{ secrets.PRIVATE_ACCESS_TOKEN }}
